# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → pick this repo.
#
# Runs as a native Node service (Node 24, required by node:sqlite) that builds
# the Angular SSR bundle and starts the PRODUCTION server — never `ng serve`.
# A persistent disk holds the SQLite database. The Postmark token is entered in
# the dashboard (sync:false), never committed.
services:
  - type: web
    name: heartdog-homestead
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run serve:ssr
    healthCheckPath: /api/config
    autoDeploy: true

    # Persistent storage for the SQLite file. DATABASE_PATH points here.
    disk:
      name: data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Canonical public origin (www). Used for password-reset links and
      # Secure cookies. Must match the primary custom domain in Render.
      - key: SITE_URL
        value: https://www.heartdoghomestead.com
      - key: DATABASE_PATH
        value: /data/heartdog.db

      # Email (Postmark over SMTP)
      - key: SMTP_HOST
        value: smtp.postmarkapp.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: MAIL_FROM
        value: Heart Dog Homestead <mdunn@heartdoghomestead.com>
      # Postmark Server API token — entered in the dashboard, not committed.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # Payments stay simulated until these are filled in (no code change).
      # - key: STRIPE_SECRET_KEY
      #     sync: false
      # - key: STRIPE_WEBHOOK_SECRET
      #     sync: false
